# United Road — Netlify configuration.
#
# The site is a single static HTML file at the repository root, so there is no
# build step: Netlify installs the function dependencies from package.json and
# publishes the repo as-is.

[build]
  # The app is compiled here instead of in every visitor's browser. Index.html
  # used to ship raw JSX plus 2.4MB of Babel Standalone and transform 4,000 lines
  # on every page load, before anything rendered.
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The section paths are served by netlify/functions/section-page.mts, which
# injects each one's own title, description and share image.
#
# The 200 rewrites that used to be here were kept "as a safety net" on the
# assumption that a function route would be matched first. It is not: the
# rewrites won, every section carried on serving the homepage's head, and the
# function was dead code from the moment it deployed. A fallback that silently
# takes precedence over the thing it is meant to be backing up is worse than no
# fallback, so they are gone.
#
# Note there is deliberately no /* catch-all. It would sit in front of the
# function routes and answer 200 for every typo instead of 404, telling Google
# the site has infinite pages.

# The scheduled article-desk run and the manual trigger both call DeepSeek,
# which can take a while on a long piece.
[functions."generate-article"]
  included_files = ["netlify/lib/**"]

[functions."article-desk-background"]
  included_files = ["netlify/lib/**"]

[functions."articles"]
  included_files = ["netlify/lib/**"]

[functions."article-page"]
  included_files = ["netlify/lib/**"]

[functions."sitemap"]
  included_files = ["netlify/lib/**"]

[functions."feed"]
  included_files = ["netlify/lib/**"]

[functions."weekly-roundup"]
  included_files = ["netlify/lib/**"]

[functions."oracle"]
  included_files = ["netlify/lib/**"]

[functions."desk-status"]
  included_files = ["netlify/lib/**"]

[functions."refresh-club-state"]
  included_files = ["netlify/lib/**"]

[functions."refit-covers"]
  included_files = ["netlify/lib/**"]

[functions."section-page"]
  included_files = ["netlify/lib/**"]

[functions."self-audit"]
  included_files = ["netlify/lib/**"]
