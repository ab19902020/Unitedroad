# United Road — Netlify configuration.
#
# The site is a single static HTML file at the repository root, so there is no
# build step: Netlify installs the function dependencies from package.json and
# publishes the repo as-is.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Every section has a real URL rather than a fragment, so it can be indexed,
# linked to and shared. The app is a single HTML file, so each of those paths
# has to serve it — a 200 rewrite, not a redirect, or the address bar would snap
# back to "/" and the URL would be pointless.
#
# These are listed one by one on purpose. A blanket /* catch-all would sit in
# front of the function routes (/api/*, /article/:id) and of any real file added
# later, and would answer 200 for every typo instead of 404 — which tells Google
# the site has infinite pages. An unknown path should still be a 404.
[[redirects]]
  from = "/news"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/articles"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/transfers"
  to = "/index.html"
  status = 200
