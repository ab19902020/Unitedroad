                            playerVars: { autoplay: 0, controls: 0, playsinline: 1, modestbranding: 1, loop: 1 },
                            events: {
                                onStateChange: (e) => {
                                    const playing = e.data === window.YT.PlayerState.PLAYING;
                                    setIsAudioPlaying(playing);
                                    if (audioBarsRef.current) audioBarsRef.current.classList.toggle('paused', !playing);
                                    if (!playing) setIsPlayingChant(false);
                                }
                            }
                        });
                    } catch(e) { console.error("YT Player Error", e); }
                };
                loadYT();
                
                // youtubeChannelId is still a placeholder, and asking the proxy to
                // fetch a feed for a channel that does not exist just burns a
                // request on every page load. Skip until a real id is set.
                if (!LINKS.youtubeChannelId || LINKS.youtubeChannelId.startsWith('UCYOUR_')) return;

                fetch(getFreshRssUrl(`https://www.youtube.com/feeds/videos.xml?channel_id=${LINKS.youtubeChannelId}`))
                    .then(res => res.json())
                    .then(data => {
                        if (data?.status === 'ok' && data.items && data.items.length > 0) {
                            const liveVideos = data.items.map(item => {
                                const id = item.link?.split('v=')[1] || item.guid?.split(':')[2];
                                return { id, title: item.title || '', thumb: `https://img.youtube.com/vi/${id}/mqdefault.jpg`, date: "New" };
                            });
                            const combined = [...liveVideos, ...UNITED_ROAD_VIDEOS];
                            setYtVideos(Array.from(new Map(combined.map(v => [v.id, v])).values()));
                        }
                    }).catch(() => {});
            }, []);

            // --- CHANT SYNC LOGIC ---
            useEffect(() => {
                if (isPlayingChant) {
                    setCurrentLyricIndex(0); let idx = 0;
                    lyricIntervalRef.current = setInterval(() => { idx = (idx + 1) % chantLines.length; setCurrentLyricIndex(idx); }, 3800);
                } else {
                    setCurrentLyricIndex(-1);
                    if (lyricIntervalRef.current) clearInterval(lyricIntervalRef.current);
                }
                return () => clearInterval(lyricIntervalRef.current);
            }, [isPlayingChant]);

            // --- SCROLL CHROME (nav elevation + progress bar) ---
            useEffect(() => {
                let ticking = false;
                const onScroll = () => {
                    if (ticking) return;
                    ticking = true;
                    window.requestAnimationFrame(() => {
                        const y = window.scrollY || 0;
                        const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
                        setScrolled(y > 24);
                        setReadProgress(Math.min(1, y / max));
                        ticking = false;
                    });
                };
                onScroll();
                window.addEventListener('scroll', onScroll, { passive: true });
                return () => window.removeEventListener('scroll', onScroll);
            }, []);

            // --- ORACLE SCROLL ---
            useEffect(() => { if (chatHistory.length > 1 || isOracleThinking) chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [chatHistory, isOracleThinking]);

            // --- HELPERS ---
            const triggerConfetti = () => { setShowConfetti(true); setTimeout(() => setShowConfetti(false), 2200); };
            const handleEnter = () => { setHasEntered(true); triggerConfetti(); };

            const handlePlayPause = () => { if (!playerRef.current?.playVideo) return; isAudioPlaying ? playerRef.current.pauseVideo() : playerRef.current.playVideo(); };
            const handleStop = () => { if (!playerRef.current?.pauseVideo) return; playerRef.current.pauseVideo(); if(typeof playerRef.current.seekTo === 'function') playerRef.current.seekTo(0); setIsPlayingChant(false); setIsAudioPlaying(false); };
            const toggleChantMode = () => {
                if (!playerRef.current?.playVideo) return;
                if (isPlayingChant) { playerRef.current.pauseVideo(); setIsPlayingChant(false); } 
                else { playerRef.current.playVideo(); playerRef.current.setVolume(90); setIsPlayingChant(true); }
            };
            const handleCopy = () => {
                try {
                    const t = document.createElement("textarea"); t.value = LINKS.chantLyrics; document.body.appendChild(t); t.select(); document.execCommand("copy"); document.body.removeChild(t);
                    setCopied(true); triggerConfetti(); setTimeout(() => setCopied(false), 2200);
                } catch (_) {}
            };

            // --- SITE SEARCH ---
            //
            // Searches the sections as well as the writing, because half of what
            // someone is looking for is a page, not an article — "chants" should
            // land on the Vault rather than on a piece that happens to mention
            // singing. Everything the desk has written is already in memory, so
            // this costs nothing and needs no server.
            const searchResults = useMemo(() => {
                const q = searchQuery.trim().toLowerCase();
                if (q.length < 2) return { pages: [], stories: [] };
                const terms = q.split(/\s+/);
                const matches = (hay) => terms.every(t => hay.includes(t));

                const pages = NAV_GROUPS
                    .flatMap(g => g.items || [{ path: g.path, label: 'Home', blurb: 'The front page', icon: Shield }])
                    .filter(p => matches(`${p.label} ${p.blurb} ${p.path}`.toLowerCase()))
                    .slice(0, 4);

                const stories = blogPosts
                    .filter(p => matches(`${p.title} ${p.excerpt} ${p.category} ${(p.tags || []).join(' ')}`.toLowerCase()))
                    .slice(0, 8);

                return { pages, stories };
            }, [searchQuery, blogPosts]);

            const hasResults = searchResults.pages.length > 0 || searchResults.stories.length > 0;

            // Escape closes whatever is open; ctrl/cmd-K opens search from anywhere.
            useEffect(() => {
                const onKey = (e) => {
                    if (e.key === 'Escape') { setSearchOpen(false); setOpenGroup(null); }
                    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setSearchOpen(true); }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, []);

            useEffect(() => { if (!searchOpen) setSearchQuery(''); }, [searchOpen]);

            // Re-scan on every route change and whenever new stories land, since
            // both mount fresh animated elements.
            usePausedOffscreenAnimations(`${path}:${blogPosts.length}:${newsItems.length}`);

            const doNavigate = (p) => {
                navigate(p);
                setIsNavOpen(false);
                setOpenGroup(null);
                setSearchOpen(false);
                setActiveGame(null);
                setActiveArchiveVideo(null); // Close archive player when navigating
                if (p === '/articles') {
                    setBlogLoading(true);
                    fetchArticles();
                }
            };

            // Jump straight into Red Devil Manager 26/27 from anywhere on the site. Launching the
            // game here as well as in the route effect covers the case where we are already on
            // /manager (the user exited the game), where no hashchange fires to trigger the effect.
            const playFeaturedGame = () => {
                doNavigate('/manager');
                setActiveGame(FEATURED_GAME);
                window.scrollTo(0, 0);
            };

            // The /manager route is a deep link that boots the featured game immediately.
            useEffect(() => {
                if (path === '/manager') setActiveGame(FEATURED_GAME);
            }, [path]);

            // Hand the whole game stage to the browser's fullscreen API so the
            // pitch fills the screen instead of sitting inside the site chrome.
            const requestGameFullscreen = () => {
                const stage = document.getElementById('ur-game-stage');
                if (!stage) return;
                const req = stage.requestFullscreen || stage.webkitRequestFullscreen || stage.msRequestFullscreen;
                if (document.fullscreenElement) { document.exitFullscreen?.(); return; }
                try { req?.call(stage); } catch (_) {}
            };

            // --- PUTER: KEEPING THE ORACLE OPEN AFTER THE DAILY BUDGET IS SPENT ---
            //
            // /api/oracle stops at 10p of DeepSeek credit a day and serves the
            // offline answers after that. Puter is a way to carry on for free:
            // it bills the *visitor's* own Puter account rather than ours.
            //
            // It is offered rather than switched on automatically, and that is a
            // deliberate call. Puter needs the reader to have an account, and
            // js.puter.com opens a popup to create or sign into one — measured,
            // not assumed: api.puter.com answers 401 to an anonymous call, and
            // the bundle's own sign-in path carries attempt_temp_user_creation.
            // Springing a third-party account popup on someone who asked who
            // scored in 1999 is worse than answering from the archive, the popup
            // needs a real click or the browser blocks it anyway, and loading a
            // third-party script on every page view would put a tracker on the
            // whole site for a feature almost nobody reaches.
            //
            // So: the script is only fetched once a reader has chosen this, and
            // the offer only appears once the day's budget is actually gone.
            const loadPuter = () => new Promise((resolve, reject) => {
                if (window.puter) return resolve(window.puter);
                const s = document.createElement('script');
                s.src = 'https://js.puter.com/v2/';
                s.async = true;
                s.onload = () => window.puter ? resolve(window.puter) : reject(new Error('puter unavailable'));
                s.onerror = () => reject(new Error('puter failed to load'));
                document.head.appendChild(s);
            });

            const connectPuter = async () => {
                setPuterBusy(true);
                try {
                    const puter = await loadPuter();
                    // Must run inside this click, or the popup is blocked.
                    if (!(await puter.auth.isSignedIn())) await puter.auth.signIn();
                    setPuterReady(true);
                    localStorage.setItem('ur-oracle-puter', '1');
                    setChatHistory(prev => [...prev, { role: 'oracle', text: 'Connected. Ask away — these answers run on your own free allowance, not ours.' }]);
                } catch (_) {
                    setChatHistory(prev => [...prev, { role: 'oracle', text: 'That did not connect — the popup may have been blocked. No matter: ask again and I will answer from the archive.' }]);
                } finally {
                    setPuterBusy(false);
                }
            };

            // Reconnect silently on a later visit if they have already opted in.
            useEffect(() => {
                if (localStorage.getItem('ur-oracle-puter') !== '1') return;
                loadPuter()
                    .then(p => p.auth.isSignedIn())
                    .then(ok => { if (ok) setPuterReady(true); })
                    .catch(() => {});
            }, []);

            const askPuter = async (query) => {
                const puter = await loadPuter();
                const r = await puter.ai.chat(
                    [{ role: 'system', content: ORACLE_CLIENT_BRAIN }, { role: 'user', content: query }],
                    { model: 'gpt-5.4-nano' },
                );
                return String(r?.message?.content ?? r?.text ?? r ?? '').trim();
            };

            const handleOracleSubmit = async (e, promptOverride = null) => {
                e?.preventDefault();
                const query = promptOverride || oracleInput.trim();
                if (!query || isOracleThinking) return;
                setChatHistory(prev => [...prev, { role: 'user', text: query }]);
                setOracleInput(''); setIsOracleThinking(true);

                // Our own endpoint first: it has the full brain, the cache and the
                // house voice. 429 means the day's 10p is spent.
                let response = null;
                let outOfBudget = false;
                try {
                    const res = await fetch('/api/oracle', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question: query }),
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data?.answer) response = data.answer;
                    } else if (res.status === 429) {
                        outOfBudget = true;
                    }
                } catch (_) { /* fall through */ }

                // Budget gone and the reader has opted in: their allowance, not ours.
                if (!response && puterReady) {
                    try { response = await askPuter(query); } catch (_) { /* fall through */ }
                }

                if (!response) response = getLocalOracleResponse(query);
                setChatHistory(prev => [...prev, { role: 'oracle', text: response }]);
                if (outOfBudget && !puterReady) setOracleCapped(true);
                setIsOracleThinking(false);
                if (response.toLowerCase().includes('treble') || response.toLowerCase().includes('glory')) triggerConfetti();
            };

            const handleSuggestedPrompt = (prompt) => {
                handleOracleSubmit({ preventDefault: () => {} }, prompt);
            };

            // REUSABLE ARCHIVE HEADER
            const MonthGroupHeader = ({ title }) => (
                <div className="flex items-center gap-4 my-8">
                    <h3 className="text-xl font-heading font-black text-gray-800 uppercase tracking-widest">{title}</h3>
                    <div className="flex-1 h-[1px] bg-gray-200"></div>
                </div>
            );

            // REUSABLE NEWS CARD
            const NewsCard = ({ n }) => {
                // Our own pieces route through the hash router; only external
                // items open in a new tab and carry nofollow.
                const linkProps = n.internal
                    ? { href: n.link, onClick: (e) => { e.preventDefault(); doNavigate(n.link.replace('#', '')); } }
                    : { href: n.link, target: '_blank', rel: 'nofollow' };
                return (
                <a {...linkProps} className="ur-card ur-edge h-full overflow-hidden group flex flex-col">
                    <div className="relative">
                        <SmartImage src={n.img} alt={n.title} seed={n.link || n.title} label={n.source}
                            wrapperClassName="aspect-[2/1]" className="w-full h-full object-cover" dim />
                        <div className="absolute bottom-3 left-4 z-10 text-[9px] font-heading font-black text-white/90 tracking-[2px] uppercase drop-shadow">{n.category || 'News'}</div>
                    </div>
                    <div className="p-6 flex-1 flex flex-col justify-between">
                        <div>
                            <div className="flex justify-between items-center gap-3 mb-3">
                                <div className="text-[9px] font-heading font-black text-[#DA291C] tracking-widest uppercase truncate">{n.source}</div>
                                <div className="text-[9px] font-heading text-gray-400 font-bold uppercase whitespace-nowrap">{n.date}</div>
                            </div>
                            <h4 className="text-sm font-heading font-bold text-gray-900 group-hover:text-[#DA291C] transition-colors leading-snug line-clamp-3">{n.title}</h4>
                        </div>
                        <div className="mt-5 h-[2px] w-0 group-hover:w-full bg-[#DA291C] transition-all duration-500 rounded-full"></div>
                    </div>
                </a>
                );
            };

            // ==========================================
            // RENDER FUNCTIONS
            // ==========================================

            // Quick-jump tiles under the hero. Keeps the deeper pages (transfers,
            // academy, videos…) one tap away instead of buried in the nav.
            const HOME_DESTINATIONS = [
                { path: '/transfers', label: 'Transfers', blurb: 'Tier-1 intel, live', icon: Crosshair, tone: 'red', live: true },
                { path: '/news', label: 'News', blurb: 'Every source, one feed', icon: Newspaper, tone: 'dark' },
                { path: '/matchday', label: 'Live Match', blurb: 'Fixtures & the table', icon: Activity, tone: 'red' },
                { path: '/articles', label: 'Articles', blurb: 'Original long reads', icon: PenTool, tone: 'green' },
                { path: '/videos', label: 'Videos', blurb: 'The film archive', icon: Film, tone: 'dark' },
                { path: '/hub', label: 'Social Hub', blurb: 'The fan channels', icon: Users, tone: 'green' },
                { path: '/vault', label: 'The Vault', blurb: 'Chants & lyrics', icon: Volume2, tone: 'red' },
                { path: '/academy', label: 'Academy', blurb: 'Carrington’s next gen', icon: Star, tone: 'green' },
            ];

            const renderHomePage = () => (
                <div className="pb-32">
                    {/* ============ HERO ============ */}
                    {/* Was 92dvh — a full screen of anthem before any football. It is
                        the site's brand moment and worth keeping, but at 74/78 the
                        breaking ticker and the top of the first story now show above
                        the fold, so the page announces itself and still gets on with
                        the news. */}
                    <section className="relative min-h-[70dvh] md:min-h-[74dvh] flex items-center justify-center overflow-hidden bg-[#07040A] pt-20 pb-10">
                        <div className="absolute inset-0 bg-cover bg-bottom opacity-[0.48]"
                            style={{ backgroundImage: "url('/assets/old-trafford.svg')" }}></div>
                        <div className="ur-aurora" style={{ background: 'radial-gradient(circle at 22% 28%, rgba(218,41,28,0.65), transparent 55%), radial-gradient(circle at 78% 72%, rgba(255,215,0,0.30), transparent 55%)' }}></div>
                        <div className="absolute inset-0 ur-grid-lines opacity-30 pointer-events-none"></div>
                        {/* Centre scrim: keeps the headline legible over the lit pitch. */}
                        <div className="absolute inset-0 pointer-events-none" style={{ background: 'radial-gradient(ellipse 60% 55% at 50% 48%, rgba(7,4,10,0.82) 0%, rgba(7,4,10,0.45) 55%, transparent 100%)' }}></div>
                        <div className="absolute inset-x-0 bottom-0 h-40 bg-gradient-to-t from-[#F9FAFB] to-transparent pointer-events-none"></div>

                        <div className="max-w-[1100px] mx-auto px-5 text-center relative z-10 flex flex-col items-center">
                            <div className="relative mb-7">
                                <div className="absolute inset-6 bg-[#DA291C] blur-[70px] opacity-60 rounded-full"></div>
                                <img src={LINKS.logoUrl} alt="United Road logo" width="224" height="224"
                                    className="relative w-32 h-32 md:w-52 md:h-52 object-contain drop-shadow-2xl ur-float" />
                            </div>

                            <div className="inline-flex items-center gap-2.5 ur-glass !bg-white/10 !border-white/20 px-5 py-2 rounded-full mb-7">
                                <span className="ur-live"></span>
                                <span className="text-[10px] font-heading font-black tracking-[2.5px] text-white/90 uppercase">The Official Matchday Anthem</span>
                            </div>

                            <h1 className="ur-display text-[46px] sm:text-[70px] lg:text-[96px] text-white mb-5 text-balance">
                                TAKE ME<br />HOME,<br /><span className="ur-ink-red">UNITED ROAD</span>
                            </h1>

                            <p className="max-w-xl mx-auto text-base sm:text-xl font-body text-white/70 font-medium tracking-tight mb-7 text-balance">
                                Chants, transfers, news, the film archive and the web arcade — every corner of following United, in one place.
                            </p>

                            <div className="flex flex-col items-center gap-3.5 w-full max-w-lg">
                                <button onClick={playFeaturedGame} className="ur-btn ur-btn-red ur-sheen group w-full px-8 py-5 flex items-center gap-4 text-left">
                                    <span className="w-11 h-11 bg-black/25 rounded-full flex items-center justify-center flex-shrink-0"><Clipboard className="w-5 h-5 text-[#FFD700]" /></span>
                                    <span className="flex flex-col items-start">
                                        <span className="text-[9px] text-[#FFD700] tracking-[2px] leading-none mb-1.5">New • Man Utd Manager Game</span>
                                        <span className="text-base sm:text-lg leading-none tracking-[1px]">Play Red Devil Manager 26/27</span>
                                    </span>
                                    <ChevronRight className="w-5 h-5 ml-auto opacity-60 group-hover:opacity-100 group-hover:translate-x-1 transition-all flex-shrink-0" />
                                </button>

                                <div className="flex flex-col sm:flex-row gap-3 w-full">
                                    <button onClick={() => doNavigate('/matchday')} className="ur-btn ur-btn-ghost flex-1 px-7 py-4 text-xs flex items-center justify-center gap-2">
                                        <Activity className="w-4 h-4 text-[#FFD700]" /> Live Match
                                    </button>
                                    <button onClick={() => doNavigate('/vault')} className="ur-btn ur-btn-ghost flex-1 px-7 py-4 text-xs flex items-center justify-center gap-2">
                                        <Volume2 className="w-4 h-4 text-[#FFD700]" /> Enter The Vault
                                    </button>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* ============ LIVE HEADLINE TICKER ============ */}
                    {blogPosts.length > 0 && (
                        <section className="bg-[#0B132B] border-y border-white/10 overflow-hidden">
                            <div className="flex items-stretch">
                                <div className="flex-shrink-0 bg-[#DA291C] px-5 md:px-7 flex items-center gap-2.5 z-10 shadow-[8px_0_20px_rgba(11,19,43,0.6)]">
                                    <span className="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                                    <span className="font-heading font-black text-[10px] tracking-[2.5px] text-white uppercase whitespace-nowrap">Breaking</span>
                                </div>
                                <div className="ur-marquee flex-1 overflow-hidden py-4">
                                    <div className="ur-marquee-track">
                                        {[0, 1].map(pass => (
                                            <div key={pass} className="flex items-center" aria-hidden={pass === 1}>
                                                {blogPosts.slice(0, 12).map((n, i) => (
                                                    <a key={`${pass}-${i}`} href={`#/article/${n.id}`}
                                                        onClick={(e) => { e.preventDefault(); doNavigate(`/article/${n.id}`); }}
                                                        className="flex items-center gap-3 px-6 whitespace-nowrap group">
                                                        <span className="text-[9px] font-heading font-black tracking-[2px] text-[#FFD700] uppercase">{n.category || 'United Road'}</span>
                                                        <span className="font-body text-sm text-white/75 group-hover:text-white transition-colors">{n.title}</span>
                                                        <span className="w-1 h-1 rounded-full bg-white/25"></span>
                                                    </a>
                                                ))}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </section>
                    )}

                    {/* ============ FRESH OFF UNITED ROAD ============ */}
                    <section className="py-12 md:py-16 bg-[#F9FAFB] border-b border-gray-200 relative">
                        <div className="absolute inset-0 ur-dot-grid opacity-50 pointer-events-none"></div>
                        <div className="max-w-[1400px] mx-auto px-5 md:px-10 relative z-10">
                            <SectionHead eyebrow="The Latest" live title="Fresh Off" accent="United Road"
                                action="All Updates" onAction={() => doNavigate('/news')} />

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {/* LATEST ARTICLE */}
                                <Reveal>
                                    {(() => {
                                        const post = blogPosts[0];
                                        if (!post) return <CardSkeleton />;
                                        return (
                                            <div onClick={() => doNavigate(`/article/${post.id}`)} role="button" tabIndex={0}
                                                onKeyDown={(e) => { if (e.key === 'Enter') doNavigate(`/article/${post.id}`); }}
                                                className="ur-card ur-edge h-full overflow-hidden cursor-pointer group flex flex-col">
                                                <div className="relative">
                                                    <SmartImage src={post.image} alt={post.title} seed={post.id} label="Article"
                                                        wrapperClassName="aspect-video" className="w-full h-full object-cover" />
                                                    <div className="absolute top-4 left-4 z-10 flex items-center gap-1.5 bg-[#02331F] text-white font-heading font-black text-[9px] tracking-[2px] px-3 py-1.5 rounded-lg uppercase">
                                                        <PenTool className="w-3 h-3 text-[#FFD700]" /> Article
                                                    </div>
                                                </div>
                                                <div className="p-7 flex-1 flex flex-col justify-between">
                                                    <div>
                                                        <div className="text-[10px] font-heading font-bold text-gray-400 uppercase tracking-widest mb-3">{post.date} • {post.author}</div>
                                                        <h3 className="text-xl font-heading font-black text-gray-900 group-hover:text-[#DA291C] transition-colors leading-tight line-clamp-3">{post.title}</h3>
                                                    </div>
                                                    <div className="mt-6 font-heading font-bold text-xs text-[#DA291C] uppercase tracking-widest flex items-center gap-2">Read Article <ChevronRight className="w-4 h-4 group-hover:translate-x-1 transition-transform" /></div>
                                                </div>
                                            </div>
                                        );
                                    })()}
                                </Reveal>

                                {/* LATEST NEWS — ours, not a link off the site */}
                                <Reveal delay={90}>
                                    {(() => {
                                        const n = blogPosts.find(p => p.kind === 'news') || blogPosts[1] || blogPosts[0];
                                        if (!n) return <CardSkeleton />;
                                        return (
                                            <div onClick={() => doNavigate(`/article/${n.id}`)} role="button" tabIndex={0}
                                                onKeyDown={(e) => { if (e.key === 'Enter') doNavigate(`/article/${n.id}`); }}
                                                className="ur-card ur-edge h-full overflow-hidden cursor-pointer group flex flex-col">
                                                <div className="relative">
                                                    <SmartImage src={n.image} alt={n.title} seed={n.id} label={n.category || 'News'}
                                                        wrapperClassName="aspect-video" className="w-full h-full object-cover" />
                                                    <div className="absolute top-4 left-4 z-10 bg-[#DA291C] text-white font-heading font-black text-[9px] tracking-[2px] px-3 py-1.5 rounded-lg uppercase">{n.category || 'News'}</div>
                                                </div>
                                                <div className="p-7 flex-1 flex flex-col justify-between">
                                                    <div>
                                                        <div className="text-[10px] font-heading font-bold text-gray-400 uppercase tracking-widest mb-3">{n.date} • {n.author}</div>
                                                        <h3 className="text-xl font-heading font-black text-gray-900 group-hover:text-[#DA291C] transition-colors leading-tight line-clamp-3">{n.title}</h3>
                                                    </div>
                                                    <div className="mt-6 font-heading font-bold text-xs text-[#DA291C] uppercase tracking-widest flex items-center gap-2">Read More <ChevronRight className="w-4 h-4 group-hover:translate-x-1 transition-transform" /></div>
                                                </div>
                                            </div>

            // not republish other outlets' headlines or send readers to their sites.
            //
            // Raw third-party feeds still appear in exactly two places, deliberately:
            // Transfers, where seeing the wire as it lands is the point, and the
            // Social Hub, which is a feed of other people's channels by definition.
            const BACKFILL_WITH_FEEDS = false;

            // Map a desk article into the shape the news cards already expect.
            const articleAsNewsItem = (post) => ({
                title: post.title,
                desc: (post.excerpt || '').replace(/<[^>]+>/g, ''),
                source: post.kind === 'article' ? 'Opinion' : 'United Road',
                // The desk's own categories drive the filters now that no external
                // items reach this page.
                category: (post.category || 'NEWS').toUpperCase().includes('TRANSFER') ? 'TRANSFERS' : (post.category || 'NEWS').toUpperCase(),

                internal: true,
                img: post.image || '',
            });

            const renderNewsPage = () => {
                const now = Date.now();

                const ownCoverage = blogPosts.map(articleAsNewsItem);
                // Drop any external item the desk has already written up, so the same
                // story does not appear twice under two different bylines.
                const ownKeys = ownCoverage.map(o => o.title.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim());
                const externals = BACKFILL_WITH_FEEDS
                    ? newsItems.filter(n => {
                        const k = (n.title || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

                        return !ownKeys.some(o => {
                            const ow = o.split(' ').filter(w => w.length > 3);
                            if (!ow.length || !kw.size) return false;
                            const shared = ow.filter(w => kw.has(w)).length;
                            return shared / Math.min(ow.length, kw.size) > 0.6;
                        });
                    })
                    : [];

                const merged = [...ownCoverage, ...externals].sort((a, b) => b.timestamp - a.timestamp);
                const filtered = newsFilter === 'ALL' ? merged : merged.filter(n => n.category === newsFilter);
                
                const recentNews = filtered.filter(n => now - n.timestamp <= THIRTY_DAYS);
                const archiveNews = filtered.filter(n => now - n.timestamp > THIRTY_DAYS);
                const groupedArchive = groupArchive(archiveNews);

                                            className={`flex-shrink-0 snap-start px-4 md:px-5 py-2 rounded-full text-[10px] font-heading font-black tracking-[1.5px] transition-all border flex items-center gap-2 ${newsFilter === f ? 'bg-gray-900 text-white border-gray-900 shadow-sm' : 'bg-white text-gray-600 border-gray-200 hover:border-[#DA291C] hover:text-[#DA291C]'}`}>
                                            {f}

                                className="fixed inset-0 z-[500] bg-[#0B132B]/70 backdrop-blur-sm flex items-start justify-center p-4 pt-[12vh]"
                                onClick={() => setSearchOpen(false)}>
                                <MotionDiv initial={{ opacity: 0, y: -16, scale: 0.98 }} animate={{ opacity: 1, y: 0, scale: 1 }} exit={{ opacity: 0, y: -16, scale: 0.98 }} transition={{ duration: 0.18 }}
                                    onClick={(e) => e.stopPropagation()}
                                    className="w-full max-w-[620px] bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-200">
                                    <div className="flex items-center gap-3 px-5 py-4 border-b border-gray-100">
                                        <SearchIcon className="w-5 h-5 text-gray-400 flex-shrink-0" />
                                        <input autoFocus type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                                            placeholder="Search news, articles and pages…"
                                            aria-label="Search United Road"
                                            autoComplete="off" autoCorrect="off" spellCheck="false"
                                            className="flex-1 bg-transparent outline-none font-body text-gray-900 placeholder-gray-400 text-[15px]" />
                                        <button onClick={() => setSearchOpen(false)} aria-label="Close search"
                                            className="w-8 h-8 flex items-center justify-center rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-700 transition-colors flex-shrink-0">
                                            <X className="w-4 h-4" />
                                        </button>
                                    </div>

                                    <div className="max-h-[55vh] overflow-y-auto p-2">
                                        {searchQuery.trim().length < 2 ? (
                                            <div className="p-5">
                                                <div className="text-[10px] font-heading font-black text-gray-400 uppercase tracking-widest mb-3">Try</div>
                                                <div className="flex flex-wrap gap-2">
                                                    {['transfers', 'academy', 'chants', 'Old Trafford', 'takeover'].map(s => (
                                                        <button key={s} onClick={() => setSearchQuery(s)}
                                                            className="px-3.5 py-2 rounded-full bg-gray-100 hover:bg-[#DA291C] hover:text-white text-gray-600 font-heading font-bold text-[11px] tracking-wide transition-colors">
                                                            {s}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        ) : !hasResults ? (
                                            <div className="p-8 text-center">
                                                <div className="font-heading font-black text-gray-900 mb-1">Nothing for “{searchQuery.trim()}”</div>
                                                <div className="font-body text-sm text-gray-500">Try a player, a club or a section name.</div>
                                            </div>
                                        ) : (
                                            <>
                                                {searchResults.pages.length > 0 && (
                                                    <>
                                                        <div className="px-4 pt-3 pb-2 text-[10px] font-heading font-black text-gray-400 uppercase tracking-widest">Pages</div>
                                                        {searchResults.pages.map(p => {
                                                            const Icon = p.icon;
                                                            return (
                                                                <button key={p.path} onClick={() => p.path === '/manager' ? playFeaturedGame() : doNavigate(p.path)}
                                                                    className="w-full text-left flex items-center gap-3 p-3 rounded-xl hover:bg-gray-50 transition-colors">
                                                                    <span className="w-9 h-9 rounded-lg bg-gray-100 text-gray-500 flex items-center justify-center flex-shrink-0"><Icon className="w-4 h-4" /></span>
                                                                    <span className="min-w-0">
                                                                        <span className="block font-heading font-black text-[13px] text-gray-900 leading-tight">{p.label}</span>
                                                                        <span className="block font-body text-[11px] text-gray-500 mt-0.5">{p.blurb}</span>
                                                                    </span>
                                                                </button>
                                                            );
                                                        })}
                                                    </>
                                                )}
                                                {searchResults.stories.length > 0 && (
                                                    <>
                                                        <div className="px-4 pt-3 pb-2 text-[10px] font-heading font-black text-gray-400 uppercase tracking-widest">Stories</div>
                                                        {searchResults.stories.map(s => (
                                                            <button key={s.id} onClick={() => doNavigate(`/article/${s.id}`)}
                                                                className="w-full text-left flex items-start gap-3 p-3 rounded-xl hover:bg-gray-50 transition-colors">
                                                                <span className="ur-chip ur-chip-red flex-shrink-0 mt-0.5">{s.category || 'NEWS'}</span>
                                                                <span className="min-w-0">
                                                                    <span className="block font-heading font-bold text-[13px] text-gray-900 leading-snug">{s.title}</span>
                                                                    <span className="block font-body text-[11px] text-gray-400 mt-0.5">{s.date}</span>
                                                                </span>
                                                            </button>
                                                        ))}
                                                    </>
                                                )}
                                            </>
                                        )}
                                    </div>
                                </MotionDiv>
                            </MotionDiv>
                        )}
                    </AnimatePresence>

                    {hasEntered && (
                        <main className="flex-1">
                            <AnimatePresence mode="wait"><MotionDiv key={path} initial={{ opacity: 0, y: 15 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -15 }} transition={{ duration: 0.3 }}>{renderPage()}</MotionDiv></AnimatePresence>
                        </main>
                    )}

                    <AnimatePresence>
                        {showCookieBanner && hasEntered && !activeGame && !activeArchiveVideo && (
                            <MotionDiv initial={{ y: 100, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: 100, opacity: 0 }} transition={{ duration: 0.5 }} className="fixed bottom-0 left-0 w-full z-[400] p-4 md:p-6 pointer-events-none">
                                <div className="max-w-[1200px] mx-auto bg-white/95 backdrop-blur-xl border border-gray-200 shadow-[0_-10px_40px_rgba(0,0,0,0.1)] rounded-3xl p-6 md:p-8 flex flex-col md:flex-row items-center justify-between gap-6 pointer-events-auto">
                                    <div className="flex-1 text-center md:text-left">
                                        <div className="flex items-center justify-center md:justify-start gap-3 mb-2">
                                            <Shield className="w-6 h-6 text-[#DA291C]" />
                                            <h3 className="font-heading font-black text-xl text-gray-900">Your Privacy, Your Choice</h3>
                                        </div>
                                        <p className="font-body text-sm text-gray-600 max-w-3xl">
                                            We use cookies to personalize content, tailor ads, and analyze traffic to give you the ultimate fan experience. By clicking "Accept All", you consent to our use of cookies. Read our <button onClick={() => { doNavigate('/privacy'); setShowCookieBanner(false); }} className="text-[#DA291C] underline font-bold hover:text-red-700">Privacy Policy</button> for more details.
                                        </p>
                                    </div>
                                    <div className="flex items-center gap-3 w-full md:w-auto">
                                        <button onClick={handleDeclineCookies} className="flex-1 md:flex-none px-6 py-4 border border-gray-300 bg-white text-gray-700 font-heading font-bold text-xs tracking-[2px] uppercase rounded-full hover:bg-gray-50 hover:border-gray-400 transition-all shadow-sm">
                                            Decline
                                        </button>
                                        <button onClick={handleAcceptCookies} className="flex-1 md:flex-none px-8 py-4 bg-[#DA291C] text-white font-heading font-black text-xs tracking-[2px] uppercase rounded-full hover:bg-red-700 transition-all shadow-md">
                                            Accept All
                                        </button>
                                    </div>
                                </div>
                            </MotionDiv>
                        )}
                    </AnimatePresence>

                    <AnimatePresence>
                        {hasEntered && !activeGame && !activeArchiveVideo && (
                            <MotionDiv initial={{y:100,opacity:0}} animate={{y:0,opacity:1}} className={`fixed right-5 md:right-8 z-[90] transition-all duration-500 ${showCookieBanner ? 'bottom-48 md:bottom-36' : 'bottom-5 md:bottom-8'}`}>
                                <div className="bg-white/95 border border-gray-200 shadow-[0_15px_40px_rgba(0,0,0,0.15)] backdrop-blur-2xl flex items-center gap-2 p-1.5 pr-6 md:pr-7 rounded-full max-w-[85vw] md:max-w-none">
                                    <button aria-label={isAudioPlaying ? 'Pause Chant' : 'Play Chant'} onClick={handlePlayPause} className="flex-shrink-0 w-10 h-10 md:w-12 md:h-12 bg-gray-100 border border-gray-200 text-gray-900 flex items-center justify-center rounded-full hover:bg-[#DA291C] hover:text-white hover:border-[#DA291C] transition-all shadow-sm">{isAudioPlaying ? <Pause className="w-4 h-4 md:w-5 md:h-5"/> : <Play className="w-4 h-4 md:w-5 md:h-5"/>}</button>
                                    <button aria-label="Stop Chant" onClick={handleStop} className="flex-shrink-0 w-10 h-10 md:w-12 md:h-12 bg-gray-100 border border-gray-200 text-gray-900 flex items-center justify-center rounded-full hover:bg-gray-800 hover:text-white transition-all shadow-sm mr-2"><Square className="w-4 h-4"/></button>
                                    <div className="min-w-0 pr-2 border-l border-gray-200 pl-4">
                                        <div className="text-[8px] md:text-[9px] font-heading font-black tracking-[2.5px] text-[#DA291C] uppercase truncate">{isAudioPlaying ? 'NOW PLAYING' : 'PAUSED'}</div>
                                        <div className="text-xs md:text-sm font-heading font-black text-gray-900 truncate">Take Me Home, United Road</div>
                                    </div>
                                    <div ref={audioBarsRef} className={`flex items-end h-4 md:h-5 gap-[2px] ml-1 ${!isAudioPlaying ? 'paused' : ''}`}>{[1,2,3,4].map((_,i) => <div key={i} className="audio-bar w-[2.5px] md:w-[3px] bg-[#DA291C] rounded-full" style={{animationDelay: `${i*130}ms`, height: !isAudioPlaying ? '5px' : undefined}}/>)}</div>
                                </div>
                            </MotionDiv>
                        )}
                    </AnimatePresence>

                    {hasEntered && !activeGame && !activeArchiveVideo && (
                        <footer className="bg-[#0B132B] pt-20 pb-12 border-t border-white/10 text-white relative mt-auto overflow-hidden">
                            <div className="absolute inset-0 ur-grid-lines opacity-30 pointer-events-none"></div>
                            <div className="absolute -top-24 left-1/4 w-[420px] h-[420px] bg-[#DA291C]/15 blur-[120px] rounded-full pointer-events-none"></div>
                            <div className="max-w-[1680px] mx-auto px-5 md:px-10 grid md:grid-cols-12 gap-10 relative z-10">
                                <div className="md:col-span-4 text-center md:text-left">
                                    <div className="flex items-center justify-center md:justify-start gap-4 mb-6">
                                        <div className="w-16 h-16 flex items-center justify-center rounded-xl shadow-md overflow-hidden bg-black"><img src={LINKS.logoUrl} alt="United Road Logo" className="w-full h-full object-contain" /></div>
                                        <div className="font-heading font-black text-3xl md:text-4xl tracking-tight drop-shadow-sm leading-none">UNITED<br/>ROAD</div>
                                    </div>
                                    <p className="text-white/70 text-sm font-body max-w-sm mx-auto md:mx-0 font-medium mb-8">The anointed home of Manchester United’s matchday anthem. Built for the faithful who sing every matchday.</p>
                                    <div className="flex justify-center md:justify-start gap-3">
                                        {socialLinks.map((s,i) => <a key={i} href={s.href} target="_blank" rel="nofollow" aria-label="United Road social link" className="w-11 h-11 bg-white/[0.07] border border-white/10 flex items-center justify-center rounded-2xl hover:bg-[#DA291C] hover:border-[#DA291C] hover:-translate-y-1 text-white transition-all">{s.icon}</a>)}
                                    </div>
                                </div>
                                <div className="md:col-span-2 text-center md:text-left">
                                    <div className="uppercase font-heading text-[10px] tracking-[3px] text-white/40 mb-6 font-black drop-shadow-sm">EXPLORE</div>
                                    <div className="space-y-4 text-[11px] tracking-widest font-heading font-bold">
                                        {/* Explicit paths. These were derived from the labels,
                                            which sent "SOCIAL HUB" to /social — a route that does
                                            not exist. It used to fall through to the homepage
                                            quietly; now that sections have real URLs it would be a
                                            shareable link that 404s. */}
                                        {[
                                            ['/', 'HOME'], ['/news', 'NEWS'], ['/articles', 'ARTICLES'],
                                            ['/transfers', 'TRANSFERS'], ['/academy', 'ACADEMY'],
                                            ['/matchday', 'LIVE MATCH'], ['/hub', 'SOCIAL HUB'],
                                            ['/vault', 'CHANTS & VAULT'], ['/videos', 'VIDEOS / MOVIES'],
                                            ['/oracle', 'THE ORACLE'], ['/games', 'GAMES'],
                                        ].map(([to, label]) => (
                                            <button key={to} onClick={() => doNavigate(to)} className="block text-white/80 hover:text-[#DA291C] mx-auto md:mx-0 transition-colors uppercase">{label}</button>
                                        ))}
                                        <button onClick={playFeaturedGame} className="flex items-center gap-2 text-[#FFD700] hover:text-[#DA291C] mx-auto md:mx-0 transition-colors uppercase"><Clipboard className="w-3.5 h-3.5"/> MANAGER 26/27</button>
                                    </div>
                                </div>
                                <div className="md:col-span-2 text-center md:text-left">
                                    <div className="uppercase font-heading text-[10px] tracking-[3px] text-white/40 mb-6 font-black drop-shadow-sm">LEGAL</div>
                                    <div className="space-y-4 text-[11px] tracking-widest font-heading font-bold">
                                        <button onClick={() => doNavigate('/about')} className="block text-white/80 hover:text-[#DA291C] mx-auto md:mx-0 transition-colors uppercase">ABOUT US</button>
                                        <button onClick={() => doNavigate('/author')} className="block text-white/80 hover:text-[#DA291C] mx-auto md:mx-0 transition-colors uppercase">WHO WRITES THIS</button>
                                        <button onClick={() => doNavigate('/standards')} className="block text-white/80 hover:text-[#DA291C] mx-auto md:mx-0 transition-colors uppercase">EDITORIAL STANDARDS</button>
                                        <button onClick={() => doNavigate('/privacy')} className="block text-white/80 hover:text-[#DA291C] mx-auto md:mx-0 transition-colors uppercase">PRIVACY POLICY</button>
                                        <button onClick={() => doNavigate('/terms')} className="block text-white/80 hover:text-[#DA291C] mx-auto md:mx-0 transition-colors uppercase">TERMS OF SERVICE</button>
                                        <button onClick={() => doNavigate('/contact')} className="block text-white/80 hover:text-[#DA291C] mx-auto md:mx-0 transition-colors uppercase">CONTACT US</button>
                                    </div>
                                </div>
                                <div className="md:col-span-4">
                                    <div className="uppercase font-heading text-[10px] tracking-[3px] text-white/40 mb-6 font-black text-center md:text-left drop-shadow-sm">STAY IN THE LOOP</div>
                                    <div className="flex flex-col sm:flex-row gap-2 sm:gap-0 max-w-sm mx-auto md:mx-0 shadow-lg rounded-xl sm:rounded-full overflow-hidden border border-white/10">
                                        <input type="text" placeholder="Your email address" aria-label="Email address" className="flex-1 bg-white/5 px-6 py-4 text-sm font-body focus:outline-none text-white placeholder:text-white/40 font-medium"/>
                                        <button onClick={() => { triggerConfetti(); }} className="bg-[#DA291C] px-8 font-heading font-black text-xs tracking-[2px] hover:bg-red-700 text-white transition-colors py-4 sm:py-0 uppercase">JOIN</button>
                                    </div>
                                    <div className="font-heading text-[9px] text-white/40 mt-5 tracking-[1px] text-center md:text-left font-medium leading-relaxed bg-white/5 p-4 rounded-xl border border-white/5">
                                        <strong>Disclaimer:</strong> United Road is an unofficial fan site. We are not affiliated with, endorsed by, or associated with Manchester United Football Club. All trademarks and copyrights belong to their respective owners.
                                    </div>
                                </div>
                            </div>
                            <div className="mt-16 pt-8 border-t border-white/10 text-center font-heading text-[9px] md:text-[10px] text-white/30 tracking-[3px] font-bold">© {new Date().getFullYear()} UNITED ROAD • MANCHESTER, ENGLAND • GLORY GLORY MAN UNITED</div>
                        </footer>
                    )}

                    <AnimatePresence>
                        {showConfetti && <div className="fixed inset-0 z-[300] pointer-events-none">{Array.from({length:45}).map((_,i) => <MotionDiv key={i} className="absolute w-2.5 h-2.5 md:w-3 md:h-3 bg-[#FFD700] rounded-full shadow-[0_0_10px_rgba(255,215,0,0.8)]" initial={{left:`${Math.random()*100}%`,top:`-20px`,scale:Math.random()*0.8+0.6}} animate={{top:`${80+Math.random()*40}%`,left:`${Math.random()*100}%`,opacity:[1,0.9,0],rotate:Math.random()*280-40}} transition={{duration:1.8+Math.random(),ease:"easeOut",delay:Math.random()*0.4}}/>)}</div>}
                    </AnimatePresence>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<UnitedRoadAnointed />);
    </script>
</body>
</html>
