        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap');
        
        html { scroll-behavior: smooth; }
        body { margin: 0; padding: 0; background-color: #F9FAFB; color: #111827; overflow-x: hidden; font-family: 'Inter', system_ui, sans-serif; -webkit-font-smoothing: antialiased; }

        .film-grain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; background-image: linear-gradient(rgba(0,0,0,0.015) 50%, transparent 50%), linear-gradient(90deg, rgba(0,0,0,0.01) 50%, transparent 50%); background-size: 4px 4px, 3px 3px; mix-blend-mode: multiply; opacity: 0.5; }

        @keyframes shimmer { 100% { transform: translateX(100%); } }

        /* ---------- Reading typography ---------- */
        /* Body copy was 16px in #4b5563, which is light for a 700-word read, and
           headings sat close to the paragraph above them so the piece ran as one
           grey block. Bigger type, darker ink, and space banked above each
           heading rather than below it so a section visibly belongs to its
           heading. */
        .prose { font-size: 1.0625rem; line-height: 1.75; color: #374151; }
        @media (min-width: 768px) { .prose { font-size: 1.125rem; line-height: 1.78; } }

        .prose > p:first-of-type { font-size: 1.1875rem; line-height: 1.65; color: #1f2937; font-weight: 500; }
        @media (min-width: 768px) { .prose > p:first-of-type { font-size: 1.3125rem; } }

        .prose h2 {
            font-family: 'Montserrat', sans-serif; font-weight: 900;
            font-size: 1.4rem; letter-spacing: -0.02em; color: #0B132B;
            margin-top: 2.75rem; margin-bottom: 0.9rem; padding-top: 0.25rem;
        }
        @media (min-width: 768px) { .prose h2 { font-size: 1.65rem; } }
        /* Short red mark above each section heading — the same rail the story
           rows use, so the two read as one system. */
        .prose h2::before {
            content: ''; display: block; width: 28px; height: 3px; border-radius: 2px;
            background: var(--ur-red); margin-bottom: 0.85rem;
        }
        .prose h3 { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.15rem; margin-top: 1.9rem; margin-bottom: 0.6rem; color: #1f2937; }
        .prose p { margin-bottom: 1.3rem; overflow-wrap: break-word; }
        .prose ul, .prose ol { padding-left: 1.4rem; margin-bottom: 1.3rem; }
        .prose ul { list-style-type: disc; }
        .prose ol { list-style-type: decimal; }
        .prose li { margin-bottom: 0.45rem; padding-left: 0.2rem; }
        .prose li::marker { color: var(--ur-red); }
        .prose strong { color: #111827; font-weight: 700; }
        /* break-all was mangling ordinary links mid-word; break-word only splits
           when a URL genuinely cannot fit. */
        .prose a { color: var(--ur-red); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; overflow-wrap: break-word; }
        .prose a:hover { color: #8B1109; }
        .prose img { width: 100%; border-radius: 1rem; margin: 1.75rem 0; }

        /* Pull quote. A quote in the middle of a piece is the one place the eye
           should stop, so it gets scale and weight rather than grey italics. */
        .prose blockquote {
            margin: 2.25rem 0; padding: 0 0 0 1.4rem;
            border-left: 3px solid var(--ur-red);
            font-family: 'Montserrat', sans-serif; font-weight: 700;
            font-size: 1.25rem; line-height: 1.4; letter-spacing: -0.01em;
            color: #0B132B; font-style: normal;
        }
        @media (min-width: 768px) { .prose blockquote { font-size: 1.5rem; padding-left: 1.75rem; } }
        .prose blockquote p { margin-bottom: 0.5rem; color: inherit; font-size: inherit; line-height: inherit; }
        .prose blockquote p:last-child { margin-bottom: 0; }

        .prose hr { border: 0; border-top: 1px solid var(--ur-line); margin: 2.5rem 0; }
        
        /* Netflix Style Hiding scrollbars for video rows */
        .netflix-row::-webkit-scrollbar { display: none; }
        .netflix-row { -ms-overflow-style: none; scrollbar-width: none; scroll-behavior: smooth; }

        /* ==========================================================
           UNITED ROAD DESIGN SYSTEM
           Brand tokens + reusable surfaces, borders, motion and
           loading states shared by every page on the site.
           ========================================================== */
        :root {
            --ur-red: #DA291C;
            --ur-red-deep: #8B1109;
            --ur-gold: #FFD700;
            --ur-gold-soft: #FFF0A8;
            --ur-green: #034A2F;
            --ur-green-deep: #012616;
            --ur-ink: #0B0308;
            --ur-navy: #0B132B;
            --ur-paper: #F9FAFB;
            --ur-line: rgba(17, 24, 39, 0.08);
            --ur-shadow-sm: 0 2px 8px rgba(11, 19, 43, 0.05);
            --ur-shadow-md: 0 10px 30px -8px rgba(11, 19, 43, 0.14);
            --ur-shadow-lg: 0 28px 60px -20px rgba(11, 19, 43, 0.28);
            --ur-shadow-red: 0 20px 45px -14px rgba(218, 41, 28, 0.55);
            --ur-shadow-gold: 0 20px 50px -18px rgba(255, 215, 0, 0.35);
            --ur-ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* ---------- Typography refinements ---------- */
        .font-heading { letter-spacing: -0.01em; }
        .text-balance { text-wrap: balance; }
        .ur-display { font-family: 'Montserrat', sans-serif; font-weight: 900; letter-spacing: -0.035em; line-height: 0.9; }
        .ur-eyebrow { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }

        /* Gradient ink for headline accents */
        .ur-ink-red { background: linear-gradient(100deg, #FF4436 0%, var(--ur-red) 42%, #9E1710 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .ur-ink-gold { background: linear-gradient(100deg, var(--ur-gold-soft) 0%, var(--ur-gold) 45%, #C9931B 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

        /* ---------- Surfaces ---------- */
        .ur-card {
            background: #fff;
            border: 1px solid var(--ur-line);
            border-radius: 24px;
            box-shadow: var(--ur-shadow-sm);
            transition: transform 0.45s var(--ur-ease), box-shadow 0.45s var(--ur-ease), border-color 0.3s ease;
        }
        .ur-card:hover { transform: translateY(-6px); box-shadow: var(--ur-shadow-lg); border-color: rgba(218, 41, 28, 0.45); }

        .ur-card-dark {
            background: linear-gradient(160deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.45s var(--ur-ease), box-shadow 0.45s var(--ur-ease), border-color 0.3s ease;
        }
        .ur-card-dark:hover { transform: translateY(-6px); border-color: rgba(255, 215, 0, 0.45); box-shadow: var(--ur-shadow-gold); }

        .ur-glass {
            background: rgba(255,255,255,0.78);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255,255,255,0.6);
        }

        /* Animated gradient hairline that traces a card on hover */
        .ur-edge { position: relative; }
        .ur-edge::after {
            content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
            background: linear-gradient(130deg, var(--ur-red), var(--ur-gold), var(--ur-red));
            background-size: 220% 220%;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
        }
        .group:hover .ur-edge::after, .ur-edge:hover::after { opacity: 1; animation: ur-edge-flow 3.2s linear infinite; }
        @keyframes ur-edge-flow { 0% { background-position: 0% 50%; } 100% { background-position: 220% 50%; } }

        /* ---------- Media ---------- */
        .ur-media { position: relative; overflow: hidden; background: #0B132B; }
        .ur-media img { transition: transform 0.9s var(--ur-ease), opacity 0.5s ease; }
        .group:hover .ur-media img { transform: scale(1.06); }
        .ur-media::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(to top, rgba(5,4,10,0.72) 0%, rgba(5,4,10,0.12) 45%, transparent 75%);
            opacity: 0.85; transition: opacity 0.5s ease;
        }
        .ur-media--flat::after { display: none; }

        /* Skeleton shimmer used while feeds and images load */
        .ur-skeleton {
            position: relative; overflow: hidden;
            background: linear-gradient(100deg, #eef0f4 30%, #f7f8fa 50%, #eef0f4 70%);
            background-size: 220% 100%;
            animation: ur-skeleton-slide 1.4s ease-in-out infinite;
        }
        .ur-skeleton-dark { background: linear-gradient(100deg, rgba(255,255,255,0.05) 30%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 70%); background-size: 220% 100%; animation: ur-skeleton-slide 1.4s ease-in-out infinite; }
        @keyframes ur-skeleton-slide { 0% { background-position: 140% 0; } 100% { background-position: -40% 0; } }

        /* Fade an image in once it has actually decoded */
        .ur-img-loading { opacity: 0; }
        .ur-img-ready { opacity: 1; }

        /* ---------- Buttons ---------- */
        .ur-btn {
            position: relative; overflow: hidden; isolation: isolate;
            font-family: 'Montserrat', sans-serif; font-weight: 900; text-transform: uppercase;
            letter-spacing: 2px; border-radius: 999px;
            transition: transform 0.3s var(--ur-ease), box-shadow 0.3s var(--ur-ease), background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        .ur-btn:hover { transform: translateY(-2px); }
        .ur-btn:active { transform: translateY(0); }
        .ur-btn-red { background: linear-gradient(135deg, #F0392B 0%, var(--ur-red) 45%, var(--ur-red-deep) 100%); color: #fff; box-shadow: var(--ur-shadow-red); }
        .ur-btn-red:hover { box-shadow: 0 26px 55px -14px rgba(218, 41, 28, 0.7); }
        .ur-btn-gold { background: linear-gradient(135deg, var(--ur-gold-soft) 0%, var(--ur-gold) 45%, #C9931B 100%); color: #14060A; box-shadow: var(--ur-shadow-gold); }
        .ur-btn-green { background: linear-gradient(135deg, #0A6B45 0%, var(--ur-green) 45%, var(--ur-green-deep) 100%); color: #fff; box-shadow: 0 18px 40px -14px rgba(3, 74, 47, 0.6); }
        .ur-btn-ghost { background: rgba(255,255,255,0.06); color: #fff; border: 1px solid rgba(255,255,255,0.22); }
        .ur-btn-ghost:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,215,0,0.6); }
        .ur-btn-outline { background: #fff; color: #111827; border: 1px solid #e5e7eb; box-shadow: var(--ur-shadow-sm); }
        .ur-btn-outline:hover { border-color: var(--ur-red); color: var(--ur-red); }

        /* Light sweep across a button/card on hover */
        .ur-sheen::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.35) 50%, transparent 65%);
            transform: translateX(-120%);
        }
        .ur-btn:hover.ur-sheen::before, .group:hover .ur-sheen::before { animation: ur-sweep 1.1s var(--ur-ease); }
        @keyframes ur-sweep { to { transform: translateX(120%); } }

        /* ---------- Badges & chips ---------- */
        .ur-chip {
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 9px;
            letter-spacing: 2px; text-transform: uppercase;
            padding: 6px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
        }
        .ur-chip-red { background: rgba(218,41,28,0.1); color: var(--ur-red); border: 1px solid rgba(218,41,28,0.28); }
        .ur-chip-gold { background: rgba(255,215,0,0.12); color: #8A6A00; border: 1px solid rgba(255,215,0,0.4); }
        .ur-chip-dark { background: rgba(0,0,0,0.55); color: var(--ur-gold); border: 1px solid rgba(255,215,0,0.3); backdrop-filter: blur(6px); }
        .ur-chip-ai { background: linear-gradient(120deg, rgba(3,74,47,0.12), rgba(255,215,0,0.16)); color: #04512F; border: 1px solid rgba(3,74,47,0.3); }

        /* Pulsing live indicator */
        .ur-live { position: relative; display: inline-block; width: 8px; height: 8px; border-radius: 999px; background: var(--ur-red); }
        .ur-live::after {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            box-shadow: 0 0 0 0 rgba(218,41,28,0.6); animation: ur-pulse 2s infinite;
        }
        @keyframes ur-pulse { 70% { box-shadow: 0 0 0 10px rgba(218,41,28,0); } 100% { box-shadow: 0 0 0 0 rgba(218,41,28,0); } }

        /* ---------- Backdrops ---------- */
        .ur-pitch {
            background-color: var(--ur-green-deep);
            background-image:
                repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 60px, transparent 60px 120px),
                radial-gradient(ellipse at 50% -10%, rgba(255,215,0,0.16) 0%, transparent 60%),
                linear-gradient(170deg, #04572F 0%, #012616 100%);
        }
        .ur-ink-bg {
            background-color: var(--ur-ink);
            background-image:
                radial-gradient(ellipse at 18% 12%, rgba(218,41,28,0.30) 0%, transparent 58%),
                radial-gradient(ellipse at 85% 85%, rgba(255,215,0,0.14) 0%, transparent 55%);
        }
        .ur-grid-lines {
            background-image: linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
            background-size: 56px 56px;
        }
        .ur-dot-grid { background-image: radial-gradient(rgba(11,19,43,0.10) 1px, transparent 1px); background-size: 22px 22px; }

        /* Slow drifting aurora used behind dark hero sections */
        .ur-aurora { position: absolute; inset: -30%; pointer-events: none; filter: blur(70px); opacity: 0.55; animation: ur-drift 22s ease-in-out infinite alternate; }
        @keyframes ur-drift { 0% { transform: translate3d(-3%, -2%, 0) scale(1); } 100% { transform: translate3d(4%, 3%, 0) scale(1.12); } }

        /* ---------- Motion ---------- */
        .ur-reveal { opacity: 0; transform: translateY(26px); transition: opacity 0.75s var(--ur-ease), transform 0.75s var(--ur-ease); }
        .ur-reveal.is-visible { opacity: 1; transform: none; }

        /* ---------- Dense story rows ---------- */
        .ur-story-row { transition: background-color 0.25s ease; margin-inline: -0.75rem; padding-inline: 0.75rem; border-radius: 14px; }
        .ur-story-row:hover { background-color: rgba(218, 41, 28, 0.035); }
        .ur-story-row:hover img { transform: scale(1.06); }
        .ur-story-row img { transition: transform 0.7s var(--ur-ease); }

        /* The short red mark that tags a story to its section. */
        .ur-rail { display: inline-block; width: 3px; height: 11px; border-radius: 2px; background: var(--ur-red); flex-shrink: 0; }

        .ur-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .ur-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        /* Sticky filter bar under the section header. Keeps the controls to hand
           on a long list instead of stranding them at the top of the page. */
        /* No border. It sat directly under the section header's own bottom rule,
           giving two parallel hairlines about 50px apart — which reads as a
           stray line rather than as structure. The shadow does the separating
           once the bar lifts off, and at rest the bar sits flush under the one
           rule the header already draws. */
        .ur-sticky-bar {
            position: sticky; top: 64px; z-index: 30;
            background: rgba(255,255,255,0.92); backdrop-filter: blur(14px) saturate(150%);
            box-shadow: 0 6px 16px -12px rgba(11, 19, 43, 0.35);
        }

        /* Panel heading: a rule that runs to the edge, the way a paper does it. */
        .ur-panel-head { display: flex; align-items: center; gap: 0.75rem; }
        .ur-panel-head::after { content: ''; flex: 1; height: 1px; background: var(--ur-line); }

        /* Applied to an element scrolled out of view, and to <html> when the tab
           is in the background. Nine animations run forever on this site — the
           aurora alone is a blur(70px) layer inset -30% repainting on a 22s
           loop — and a phone pays for all of them whether or not they are on
           screen. See usePausedOffscreenAnimations. */
        .ur-anim-off, .ur-anim-off * { animation-play-state: paused !important; }

        .ur-float { animation: ur-float 7s ease-in-out infinite; }
        @keyframes ur-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        @keyframes ur-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .ur-marquee-track { display: flex; width: max-content; animation: ur-marquee 42s linear infinite; }
        .ur-marquee:hover .ur-marquee-track { animation-play-state: paused; }

        /* Thin scroll progress bar pinned under the nav */
        .ur-progress { transform-origin: 0 50%; will-change: transform; }

        /* ---------- Games ---------- */
        .ur-tilt { transform-style: preserve-3d; transition: transform 0.5s var(--ur-ease); }
        .ur-game-card { position: relative; isolation: isolate; }
        .ur-game-card::before {
            content: ''; position: absolute; inset: -1px; border-radius: inherit; z-index: -1;
            background: conic-gradient(from var(--ur-angle, 0deg), transparent 0deg, var(--ur-glow, #FFD700) 90deg, transparent 200deg, var(--ur-glow, #FFD700) 300deg, transparent 360deg);
            opacity: 0; transition: opacity 0.45s ease;
        }
        .ur-game-card:hover::before { opacity: 0.85; animation: ur-spin-border 4s linear infinite; }
        @property --ur-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
        @keyframes ur-spin-border { to { --ur-angle: 360deg; } }

        /* ---------- Prose upgrades ---------- */

            const tilt = (h % 5) * 4 - 8;
            const caption = String(label || 'UNITED ROAD').toUpperCase().slice(0, 22);
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${theme.a}"/><stop offset="100%" stop-color="${theme.b}"/></linearGradient>
<radialGradient id="r" cx="22%" cy="18%" r="72%"><stop offset="0%" stop-color="${theme.accent}" stop-opacity="0.32"/><stop offset="100%" stop-color="${theme.accent}" stop-opacity="0"/></radialGradient>
</defs>
<rect width="800" height="450" fill="url(#g)"/>
<rect width="800" height="450" fill="url(#r)"/>
<g opacity="0.14" transform="rotate(${tilt} 400 225)">
<rect x="-60" y="60" width="34" height="420" fill="${theme.accent}"/>
<rect x="10" y="-40" width="18" height="560" fill="#ffffff"/>
<rect x="700" y="-40" width="46" height="560" fill="${theme.accent}"/>
<rect x="770" y="-40" width="14" height="560" fill="#ffffff"/>
</g>
<g opacity="0.9" transform="translate(400 178)">
<path d="M0 -66 L58 -42 L58 8 C58 48 30 74 0 88 C-30 74 -58 48 -58 8 L-58 -42 Z" fill="none" stroke="${theme.accent}" stroke-width="4"/>
<path d="M0 -40 L26 -12 L0 16 L-26 -12 Z" fill="${theme.accent}" opacity="0.85"/>
</g>
<text x="400" y="322" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="8" text-anchor="middle" fill="#ffffff">UNITED ROAD</text>
<text x="400" y="360" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="5" text-anchor="middle" fill="${theme.accent}" opacity="0.9">${caption.replace(/[<>&"]/g, '')}</text>
</svg>`;
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        };

        // Monogram avatar for creators whose profile picture URL has expired.
        const urMonogram = (name) => {
            const clean = String(name || 'UR').replace(/[^A-Za-z0-9 ]/g, '').trim();
            const initials = (clean.split(/\s+/).slice(0, 2).map(w => w[0]).join('') || 'UR').toUpperCase();
            const theme = UR_COVER_THEMES[urHash(name) % UR_COVER_THEMES.length];
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" rx="48" fill="${theme.a}"/><text x="48" y="60" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" text-anchor="middle" fill="${theme.accent}">${initials}</text></svg>`;
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        };

        // YouTube only guarantees the lowest-resolution still. maxresdefault is
        // missing for a large share of older videos and silently returns a grey
        // 120x90 placeholder, which is exactly what used to show up on the site.
        const urYouTubeThumbs = (videoId) => videoId ? [
            `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`,
            `https://i.ytimg.com/vi/${videoId}/sddefault.jpg`,
            `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`,
            `https://i.ytimg.com/vi/${videoId}/mqdefault.jpg`,
        ] : [];

        // Pull a YouTube video id out of any of the link shapes the feeds use.
        const urVideoId = (item) => {
            if (!item) return null;
            if (item.videoId) return item.videoId;
            const link = item.link || '';
            if (link.includes('v=')) return link.split('v=')[1].split('&')[0];
            if (link.includes('youtu.be/')) return link.split('youtu.be/')[1].split(/[?&]/)[0];
            if (link.includes('/shorts/')) return link.split('/shorts/')[1].split(/[?&]/)[0];
            if (item.guid && item.guid.includes('yt:video:')) return item.guid.split('yt:video:')[1];
            return null;
        };

        // Image with a candidate chain: try each source in turn, then fall back to
        // generated brand art. Also holds a shimmering skeleton until the real
        // pixels have decoded so cards never flash an empty grey box.
        const SmartImage = ({ sources = [], src, alt = '', className = '', wrapperClassName = '', seed, label, imgProps = {}, eager = false, dim = false }) => {
            const candidates = useMemo(() => {
                const list = (src ? [src] : []).concat(sources).filter(Boolean).filter((v, i, a) => a.indexOf(v) === i);
                // Feeds occasionally hand back these sentinel values instead of a URL.
                return list.filter(u => typeof u === 'string' && u !== 'self' && u !== 'default' && u !== 'nsfw' && u !== 'spoiler');
            }, [src, sources.join('|')]);

            const fallback = useMemo(() => urGeneratedCover(seed || alt || label || 'united road', label || ''), [seed, alt, label]);
            const [index, setIndex] = useState(0);
            const [loaded, setLoaded] = useState(false);

            // A new candidate list (card recycled by the feed refresh) restarts the chain.
            useEffect(() => { setIndex(0); setLoaded(false); }, [candidates.join('|')]);

            const current = index < candidates.length ? candidates[index] : fallback;
            const isFallback = index >= candidates.length;

            // Hotlink-protected publisher CDNs sometimes accept the connection and
            // then never answer, which would leave a card shimmering forever. Give
            // each candidate a deadline and move on if it misses it.
            useEffect(() => {
                if (loaded || isFallback) return;
                const timer = setTimeout(() => setIndex(i => i + 1), 6000);
                return () => clearTimeout(timer);
            }, [current, loaded, isFallback]);

            return (
                <div className={`ur-media ${wrapperClassName}`}>
                    {!loaded && <div className="absolute inset-0 ur-skeleton" aria-hidden="true"></div>}
                    <img
                        src={current}
                        alt={alt}
                        loading={eager ? 'eager' : 'lazy'}
                        decoding="async"
                        onLoad={(e) => {
                            // YouTube answers a missing maxres still with a 120x90 grey
                            // filler rather than a 404, so check the decoded size too.
                            const el = e.currentTarget;
                            if (!isFallback && el.naturalWidth > 0 && el.naturalWidth <= 121 && el.naturalHeight <= 91) {
                                setIndex(i => i + 1);
                                return;
                            }
                            setLoaded(true);
                        }}
                        onError={() => { setLoaded(false); setIndex(i => i + 1); }}
                        className={`${className} ${loaded ? 'ur-img-ready' : 'ur-img-loading'} ${dim && loaded && !isFallback ? 'brightness-[0.88]' : ''}`}
                        {...imgProps}
                    />
                </div>
            );
        };

        // Round avatar with the same resilience, falling back to initials.
        const SmartAvatar = ({ src, name, className = 'w-10 h-10' }) => {
            const fallback = useMemo(() => urMonogram(name), [name]);
            // 'pending' -> 'ok' | 'failed'. Kept as one value so the fallback
            // image loading cannot flip us back to the broken original.
            const [state, setState] = useState('pending');
            useEffect(() => { setState('pending'); }, [src]);
            // Creator avatar URLs rot constantly and some hosts hang rather than
            // 404, so fall back on a deadline as well as on error.
            useEffect(() => {
                if (!src || state !== 'pending') return;
                const timer = setTimeout(() => setState('failed'), 6000);
                return () => clearTimeout(timer);
            }, [src, state]);
            const useFallback = !src || state === 'failed';
            return (
                <img
                    src={useFallback ? fallback : src}
                    alt={name || ''}
                    loading="lazy"
                    onLoad={() => { if (!useFallback) setState('ok'); }}
                    onError={() => setState('failed')}
                    className={`${className} rounded-full object-cover bg-white border border-black/10 flex-shrink-0`}
                />
            );
        };

        // Fades content up as it scrolls into view. Degrades to plain content
        // where IntersectionObserver is unavailable or motion is reduced.
        const Reveal = ({ children, delay = 0, className = '' }) => {
            const ref = useRef(null);
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                if (typeof IntersectionObserver === 'undefined') { setVisible(true); return; }
                const node = ref.current;
                if (!node) return;
                const obs = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) { setVisible(true); obs.disconnect(); }
                }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
                obs.observe(node);
                return () => obs.disconnect();
            }, []);
            return (
                <div ref={ref} className={`ur-reveal ${visible ? 'is-visible' : ''} ${className}`} style={{ transitionDelay: `${delay}ms` }}>
                    {children}
                </div>
            );
        };

        // Loading placeholders that mirror the real card layout, so the page does
        // not jump around once a feed lands.
        const CardSkeleton = ({ dark = false }) => (
            <div className={`rounded-[24px] overflow-hidden border ${dark ? 'border-white/10 bg-white/5' : 'border-gray-200 bg-white'}`}>
                <div className={`aspect-video w-full ${dark ? 'ur-skeleton-dark' : 'ur-skeleton'}`}></div>
                <div className="p-6 space-y-3">
                    <div className={`h-2.5 w-24 rounded-full ${dark ? 'ur-skeleton-dark' : 'ur-skeleton'}`}></div>
                    <div className={`h-4 w-full rounded-full ${dark ? 'ur-skeleton-dark' : 'ur-skeleton'}`}></div>
                    <div className={`h-4 w-3/4 rounded-full ${dark ? 'ur-skeleton-dark' : 'ur-skeleton'}`}></div>
                </div>
            </div>
        );

        const SkeletonGrid = ({ count = 6, dark = false, className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6' }) => (
            <div className={className}>{Array.from({ length: count }).map((_, i) => <CardSkeleton key={i} dark={dark} />)}</div>
        );

        // Shared page masthead so every section opens with the same rhythm.
        // Section header.
        //
        // This used to run to about 380px on desktop and 530 on mobile before a
        // single story appeared — an icon badge, a 72px title, a three-line
        // standfirst and a control row, all stacked. On a phone that is most of
        // the screen and a full scroll before any news. A sports desk gives its
        // section header a fraction of that and puts the story at the top, so
        // this is now a single tight band: eyebrow and title on one line,
        // standfirst beside them, controls on the right.
        const PageHero = ({ eyebrow, title, accent, blurb, icon: Icon, tone = 'light', children, live = false }) => {
            const dark = tone === 'dark';
            return (
                <div className={`relative overflow-hidden ${dark ? '' : 'border-b border-gray-200 bg-white'}`}>
                    {!dark && <div className="absolute inset-0 ur-dot-grid opacity-50 pointer-events-none"></div>}
                    <div className="max-w-[1680px] mx-auto px-5 md:px-10 pt-6 pb-5 md:pt-8 md:pb-7 relative z-10">
                        <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 lg:gap-10">
                            <div className="min-w-0">
                                <div className={`flex items-center gap-2.5 mb-2 ${dark ? 'text-[#FFD700]' : 'text-[#DA291C]'}`}>
                                    {Icon && <Icon className="w-4 h-4 flex-shrink-0" />}
                                    <span className="ur-eyebrow flex items-center gap-2 !text-[10px]">
                                        {live && <span className="ur-live"></span>}
                                        {eyebrow}
                                    </span>
                                </div>
                                <div className="flex flex-col xl:flex-row xl:items-baseline xl:gap-5">
                                    <h1 className={`ur-display text-[34px] sm:text-[42px] md:text-[52px] leading-[0.95] whitespace-nowrap ${dark ? 'text-white' : 'text-gray-900'}`}>
                                        {title}{accent && <> <span className={dark ? 'ur-ink-gold' : 'ur-ink-red'}>{accent}</span></>}
                                    </h1>
                                    {/* Hidden on phones. It explains the section rather
                                        than navigating it, and three lines of it is a
                                        third of a small screen spent before the news. */}
                                    {blurb && (
                                        <p className={`hidden sm:block mt-2 xl:mt-0 text-[13px] md:text-[14px] font-body font-medium max-w-xl leading-snug ${dark ? 'text-white/60' : 'text-gray-500'}`}>{blurb}</p>
                                    )}
                                </div>
                            </div>
                            {children && <div className="flex-shrink-0">{children}</div>}
                        </div>
                    </div>
                </div>
            );
        };

        // Stop paying for animations nobody is looking at.
        //
        // The site runs nine infinite CSS animations — the aurora drift, the
        // ticker marquee, the floating cards, the radar sweep, the audio bars,
        // the live dots and the loading skeletons. The browser keeps compositing
        // every one of them whether it is on screen or not, and the aurora is a
        // 70px blur over a layer inset -30%, which is the single most expensive
        // thing on the page. On a mid-range Android that is real battery and a
        // dropped-frame scroll for decoration nobody can see.
        //
        // So: paused when scrolled out of view, and paused wholesale when the tab
        // is in the background. The margin is generous so an animation is already
        // running by the time it scrolls in — it never appears frozen.
        const ANIMATED_SELECTOR = '.ur-aurora, .ur-marquee-track, .ur-float, .radar-sweep, .audio-bar, .ur-live, .ur-skeleton, .ur-skeleton-dark';

        const usePausedOffscreenAnimations = (key) => {
            useEffect(() => {
                if (typeof IntersectionObserver === 'undefined') return;
                const nodes = Array.from(document.querySelectorAll(ANIMATED_SELECTOR));
                const io = new IntersectionObserver(
                    (entries) => entries.forEach(e => e.target.classList.toggle('ur-anim-off', !e.isIntersecting)),
                    { rootMargin: '200px 0px' },
                );
                // Observe only — never pre-pause. If IntersectionObserver is slow
                // to deliver its first records, or never fires at all, the site
                // behaves exactly as it did before rather than freezing every
                // animation on the page. Pausing is something the observer does,
                // not a state we start in and hope to be rescued from.
                nodes.forEach(n => io.observe(n));

                const onVisibility = () =>
                    document.documentElement.classList.toggle('ur-anim-off', document.hidden);
                document.addEventListener('visibilitychange', onVisibility);

                return () => {
                    io.disconnect();
                    document.removeEventListener('visibilitychange', onVisibility);
                    nodes.forEach(n => n.classList.remove('ur-anim-off'));
                };
            }, [key]);
        };

        // Compact heading for a band within a page. The home page's section
        // headings were 60px display type with an eyebrow above and 40px of air
        // below — a third of a screen to say "The Latest" before the stories it
        // introduces. This says the same thing in a quarter of the height, with
        // the rule carrying the eye across to the action on the right.
        const SectionHead = ({ eyebrow, title, accent, live = false, action, onAction }) => (
            <div className="flex items-end justify-between gap-6 mb-6">
                <div className="min-w-0">
                    {eyebrow && (
                        <span className="ur-eyebrow !text-[10px] text-[#DA291C] flex items-center gap-2 mb-1.5">
                            {live && <span className="ur-live"></span>}{eyebrow}
                        </span>
                    )}
                    <h2 className="ur-display text-[26px] md:text-[34px] leading-none text-gray-900">
                        {title}{accent && <> <span className="ur-ink-red">{accent}</span></>}
                    </h2>
                </div>
                {action && (
                    <button onClick={onAction} className="flex-shrink-0 font-heading font-black text-[10px] tracking-[1.5px] uppercase text-gray-500 hover:text-[#DA291C] transition-colors flex items-center gap-1.5 pb-1">
                        {action} <ChevronRight className="w-3.5 h-3.5" />
                    </button>
                )}
            </div>
        );

        // Dense story row — the workhorse of a news page.
        //
        // The secondary stories used to be full cards: ~290px tall to hold two
        // lines of headline and nothing else, so four of them filled a screen
        // with mostly white space. This is the shape a sports desk actually
        // uses for everything below the lead — thumbnail, category rail,
        // headline, timestamp, about 96px, scannable a dozen at a time.
        const StoryRow = ({ title, image, kicker, date, seed, meta, onOpen, href, index }) => {
            const open = (e) => { if (onOpen) { e.preventDefault(); onOpen(); } };
            return (
                <a href={href || '#'} onClick={open}
                    {...(!onOpen && href ? { target: '_blank', rel: 'nofollow' } : {})}
                    className="ur-story-row group flex items-stretch gap-4 py-3.5 cursor-pointer border-b border-gray-100 last:border-0">
                    <div className="relative w-[100px] sm:w-[124px] flex-shrink-0 rounded-xl overflow-hidden aspect-[4/3] bg-gray-100">
                        <SmartImage src={image} alt="" seed={seed || title} label={kicker || 'NEWS'} className="w-full h-full object-cover" />
                        {index != null && index < 3 && (
                            <span className="absolute top-1.5 left-1.5 w-5 h-5 rounded-md bg-black/70 backdrop-blur-sm text-[10px] font-heading font-black text-white flex items-center justify-center">{index + 1}</span>
                        )}
                    </div>
                    <div className="min-w-0 flex-1 flex flex-col justify-center">
                        <div className="flex items-center gap-2 mb-1.5">
                            <span className="ur-rail"></span>
                            <span className="text-[9px] font-heading font-black tracking-[1.5px] uppercase text-[#DA291C] truncate">{kicker}</span>
                            <span className="text-[9px] font-heading font-bold tracking-[1px] uppercase text-gray-400 ml-auto whitespace-nowrap">{date}</span>
                        </div>
                        <h3 className="font-heading font-bold text-[15px] sm:text-[16px] text-gray-900 leading-[1.25] group-hover:text-[#DA291C] transition-colors ur-clamp-3">{title}</h3>
                        {meta && <div className="text-[10px] font-heading font-bold tracking-wide uppercase text-gray-400 mt-1.5">{meta}</div>}
                    </div>
                </a>
            );
        };

        // Segmented Recent / Archive switch used by news, articles and the hub.
        const ViewToggle = ({ value, onChange, options }) => (
            <div className="inline-flex items-center bg-white p-1.5 rounded-full border border-gray-200 shadow-sm">
                {options.map(opt => {
                    const Icon = opt.icon;
                    const active = value === opt.id;
                    return (
                        <button key={opt.id} onClick={() => onChange(opt.id)} aria-pressed={active}
                            className={`px-5 md:px-6 py-2.5 rounded-full text-[10px] md:text-xs font-heading font-black tracking-[1.5px] transition-all flex items-center gap-2 ${active ? 'bg-[#DA291C] text-white shadow-[0_6px_18px_-6px_rgba(218,41,28,0.8)]' : 'text-gray-500 hover:text-gray-900'}`}>
                            {Icon && <Icon className="w-3.5 h-3.5" />}{opt.label}
                        </button>
                    );
                })}
            </div>
        );

        // Cinematic arcade tile. The whole card is the hit target (not just the
        // small button at the bottom), it tilts toward the cursor, and the accent
        // colour is driven by the game's own palette so the grid reads as a shelf
        // of distinct titles rather than five identical green boxes.
        const GameCard = ({ game, onPlay }) => {
            const ref = useRef(null);
            const [tilt, setTilt] = useState('');
            const locked = !!game.isComingSoon;

            const handleMove = (e) => {
                const node = ref.current;
                if (!node || locked || window.matchMedia('(hover: none)').matches) return;
                const r = node.getBoundingClientRect();
                const px = (e.clientX - r.left) / r.width - 0.5;
                const py = (e.clientY - r.top) / r.height - 0.5;
                setTilt(`perspective(1100px) rotateX(${(-py * 7).toFixed(2)}deg) rotateY(${(px * 9).toFixed(2)}deg) translateY(-8px)`);
            };

            const meta = game.meta || {};

            return (
                <div
                    ref={ref}
                    onMouseMove={handleMove}
                    onMouseLeave={() => setTilt('')}
                    onClick={() => !locked && onPlay(game)}
                    role={locked ? undefined : 'button'}
                    tabIndex={locked ? -1 : 0}
                    onKeyDown={(e) => { if (!locked && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); onPlay(game); } }}
                    aria-label={locked ? `${game.title} — coming soon` : `Play ${game.title}`}
                    style={{ transform: tilt, '--ur-glow': game.glow || '#FFD700' }}
                    className={`ur-tilt ur-game-card group relative rounded-[30px] overflow-hidden flex flex-col h-full bg-[#04150D] border border-white/10 shadow-[0_25px_60px_-25px_rgba(0,0,0,0.9)] ${locked ? 'cursor-default' : 'cursor-pointer hover:border-white/25'}`}
                >
                    <div className="relative aspect-[16/10] w-full overflow-hidden bg-[#05070F]">
                        <SmartImage
                            src={game.thumbnail}
                            alt={`Cover art for ${game.title}`}
                            seed={game.id} label={game.tag}
                            wrapperClassName="absolute inset-0 ur-media--flat"
                            className={`w-full h-full object-cover transition-transform duration-[900ms] ${locked ? 'grayscale opacity-45' : 'group-hover:scale-[1.07]'}`}
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-[#04150D] via-[#04150D]/25 to-transparent pointer-events-none"></div>
                        <div className="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"
                            style={{ background: `radial-gradient(ellipse at 50% 100%, ${game.accent || '#DA291C'}55 0%, transparent 65%)` }}></div>

                        {game.tag && <div className="absolute top-4 left-4 z-10 ur-chip ur-chip-dark">{game.tag}</div>}

                        {locked ? (
                            <div className="absolute inset-0 flex items-center justify-center backdrop-blur-[2px] z-10">
                                <div className="bg-black/65 border border-[#FFD700]/30 text-[#FFD700] font-heading font-black text-[10px] tracking-[3px] px-6 py-2.5 rounded-full uppercase flex items-center gap-2">
                                    <Lock className="w-3.5 h-3.5" /> Coming Soon
                                </div>
                            </div>
                        ) : (
                            <div className="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
                                <div className="w-16 h-16 rounded-full flex items-center justify-center shadow-2xl border-2 border-white/40 opacity-0 scale-75 group-hover:opacity-100 group-hover:scale-100 transition-all duration-400"
                                    style={{ background: game.accent || '#DA291C' }}>
                                    <Play className="w-7 h-7 text-white ml-1" fill="currentColor" />
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="p-6 md:p-7 flex flex-col flex-1 justify-between relative z-10">
                        <div>
                            <h2 className="text-xl md:text-2xl font-heading font-black text-white tracking-tight mb-2.5 transition-colors" style={locked ? undefined : { color: undefined }}>
                                <span className="group-hover:text-[#FFD700] transition-colors">{game.title}</span>
                            </h2>
                            <p className="text-white/60 font-body text-sm leading-relaxed line-clamp-3">{game.description}</p>

                            <div className="flex flex-wrap gap-x-4 gap-y-2 mt-5">
                                {meta.session && <span className="flex items-center gap-1.5 text-[10px] font-heading font-bold tracking-[1.5px] uppercase text-white/45"><ClockIcon className="w-3.5 h-3.5" /> {meta.session}</span>}
                                {meta.difficulty && <span className="flex items-center gap-1.5 text-[10px] font-heading font-bold tracking-[1.5px] uppercase text-white/45"><Activity className="w-3.5 h-3.5" /> {meta.difficulty}</span>}
                                {meta.mode && <span className="flex items-center gap-1.5 text-[10px] font-heading font-bold tracking-[1.5px] uppercase text-white/45"><Users className="w-3.5 h-3.5" /> {meta.mode}</span>}
                            </div>
                        </div>

                        {locked ? (
                            <div className="w-full mt-6 bg-white/5 text-white/30 border border-white/10 font-heading font-black text-[11px] tracking-[2px] uppercase py-4 rounded-full flex items-center justify-center gap-2">
                                <Lock className="w-3.5 h-3.5" /> Locked
                            </div>
                        ) : (
                            <div className="ur-btn ur-sheen w-full mt-6 text-white font-heading font-black text-[11px] tracking-[2px] uppercase py-4 rounded-full flex items-center justify-center gap-2 shadow-lg"
                                style={{ background: `linear-gradient(135deg, ${game.accent || '#DA291C'} 0%, #0B0308 130%)` }}>
                                <Play className="w-4 h-4" fill="currentColor" /> Play Now
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // One social card shared by the home page and the hub, so a YouTube post
        // or a Reddit thread looks identical wherever it surfaces.
        const SocialCard = ({ item, compact = false }) => {
            const isReddit = item.type === 'reddit';
            const isVideo = item.type === 'youtube';

                if (diffInSeconds < 3600) { const m = Math.floor(diffInSeconds / 60); return `${m} Min${m !== 1 ? 's' : ''} Ago`; }
                if (diffInSeconds < 86400) { const h = Math.floor(diffInSeconds / 3600); return `${h} Hour${h !== 1 ? 's' : ''} Ago`; }

                let hasRun = false;

                    if (entry.isIntersecting && !hasRun) {
                        hasRun = true;
                        let start = 0; const duration = 1600; const increment = Math.ceil(end / 40);
                        const timer = setInterval(() => {
                            start += increment;
                            if (start >= end) { 
                                if(isMounted) setCount(end); 
                                clearInterval(timer); 
                            } else {
                                if(isMounted) setCount(start);
                            }
                        }, duration / 40);

                if (ref.current) observer.observe(ref.current);

                if (legacy.startsWith('/')) return legacy;
                // Trailing slashes are the same page, not a different one.
                return window.location.pathname.replace(/\/+$/, '') || '/';
            };
            const [path, setPath] = useState(readLocation);

            useEffect(() => {
                // Rewrite a legacy hash URL to its real path, so the address bar

                const legacy = window.location.hash.replace('#', '');
                if (legacy.startsWith('/')) {
                    window.history.replaceState({}, '', legacy);
