<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ultimate United Quiz game cover">
  <defs>
    <radialGradient id="qzBg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#0A5A38"/>
      <stop offset="55%" stop-color="#02331F"/>
      <stop offset="100%" stop-color="#011A11"/>
    </radialGradient>
    <radialGradient id="qzGoldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qzTrophy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFEA9E"/>
      <stop offset="45%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#C99A00"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#qzBg)"/>

  <!-- confetti scatter -->
  <g fill="#FFD700" opacity="0.5">
    <circle cx="80" cy="90" r="5"/>
    <circle cx="150" cy="160" r="4"/>
    <circle cx="60" cy="260" r="4"/>
    <circle cx="120" cy="380" r="5"/>
    <circle cx="700" cy="110" r="5"/>
    <circle cx="740" cy="220" r="4"/>
    <circle cx="690" cy="340" r="4"/>
    <circle cx="650" cy="80" r="4"/>
  </g>
  <g fill="#DA291C" opacity="0.45">
    <circle cx="110" cy="130" r="4"/>
    <circle cx="200" cy="90" r="4"/>
    <circle cx="80" cy="330" r="4"/>
    <circle cx="715" cy="170" r="4"/>
    <circle cx="630" cy="300" r="4"/>
  </g>

  <!-- crest-like backdrop ring -->
  <circle cx="400" cy="270" r="190" fill="none" stroke="#FFD700" stroke-opacity="0.12" stroke-width="22"/>

  <!-- trophy -->
  <circle cx="290" cy="265" r="110" fill="url(#qzGoldGlow)"/>
  <g transform="translate(230,190)">
    <rect x="34" y="118" width="52" height="16" rx="4" fill="url(#qzTrophy)"/>
    <rect x="46" y="100" width="28" height="22" fill="url(#qzTrophy)"/>
    <path d="M 18 16 H 102 V 52 C 102 86 84 104 60 104 C 36 104 18 86 18 52 Z" fill="url(#qzTrophy)"/>
    <path d="M 18 24 C -6 24 -6 70 26 76" fill="none" stroke="url(#qzTrophy)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 102 24 C 126 24 126 70 94 76" fill="none" stroke="url(#qzTrophy)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="60" cy="50" r="16" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- big question mark badge -->
  <g transform="translate(505,255) rotate(-6)">
    <circle r="120" fill="#0B3A24" stroke="#FFD700" stroke-opacity="0.4" stroke-width="4"/>
    <text x="0" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="190" font-weight="700" fill="#FFFFFF">?</text>
  </g>

  <!-- quiz answer pills -->
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <g transform="translate(80,470)">
      <rect width="140" height="56" rx="28" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
      <circle cx="32" cy="28" r="16" fill="#FFFFFF" fill-opacity="0.15"/>
      <text x="32" y="36" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.8">A</text>
    </g>
    <g transform="translate(245,470)">
      <rect width="140" height="56" rx="28" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
      <circle cx="32" cy="28" r="16" fill="#FFFFFF" fill-opacity="0.15"/>
      <text x="32" y="36" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.8">B</text>
    </g>
    <g transform="translate(410,470)">
      <rect width="150" height="56" rx="28" fill="#FFD700"/>
      <circle cx="32" cy="28" r="16" fill="#02331F"/>
      <text x="32" y="36" text-anchor="middle" fill="#FFD700">C</text>
      <path d="M 100 28 l 9 9 l 16 -18" fill="none" stroke="#02331F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(585,470)">
      <rect width="140" height="56" rx="28" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
      <circle cx="32" cy="28" r="16" fill="#FFFFFF" fill-opacity="0.15"/>
      <text x="32" y="36" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.8">D</text>
    </g>
  </g>
</svg>
